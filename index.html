<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BB Fitness · Programma</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
  --primary: #FF6B00; /* Arancione Neon */
  --primary-glow: rgba(255, 107, 0, 0.4);
  --bg: #0A0A0A;
  --card: #161616;
  --text: #F0F0F0;
  --text-mut: #999999;
  --border: #333333;
  --s1: #FF6B00; --s2: #00E5FF; --s3: #FFD600; --s4: #00E676; --s5: #D500F9; --st: #FF1744; --mb: #78909C;
  --onc: #000;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  --bg: #F4F4F4; --card: #FFFFFF; --text: #111111; --text-mut: #666666; --border: #DDDDDD;
  --primary-glow: rgba(255, 107, 0, 0.2); --onc: #FFF;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 "Avenir Next", Avenir, "Trebuchet MS", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background 0.3s; }
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.02em; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: 100%; }
input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }

/* Header */
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); box-shadow: 0 4px 20px var(--primary-glow); }
.in { max-width: 720px; margin: 0 auto; padding: 12px 16px; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.brand-logo { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: var(--primary); text-shadow: 0 0 10px var(--primary); border: 1px solid var(--primary); }
.brand-text { font-size: 14px; font-weight: 800; line-height: 1.2; }
.brand-sub { font-size: 11px; color: var(--text-mut); font-weight: 400; }
.nav-icons { display: flex; gap: 12px; align-items: center; }
.icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--text); transition: 0.2s; }
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active { background: var(--primary); color: var(--onc); border-color: var(--primary); }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px 120px; position: relative; z-index: 1; }

/* Watermark Logo */
.wm { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 500px; opacity: 0.08; z-index: 0; pointer-events: none; }

/* UI Elements */
.hero { background: var(--card); border: 1.5px solid var(--primary); border-radius: 16px; padding: 16px; position: relative; overflow: hidden; box-shadow: 0 0 30px var(--primary-glow); }
.badge { display: inline-block; font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 99px; color: var(--onc); background: var(--c, var(--primary)); margin-right: 6px; }
.chip { font-size: 11px; border: 1px solid var(--border); padding: 2px 8px; border-radius: 9px; color: var(--text-mut); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--primary); color: var(--onc); font-weight: 800; border-radius: 10px; padding: 10px 16px; font-size: 14px; margin-top: 10px; box-shadow: 0 0 15px var(--primary-glow); }
.btn.o { background: transparent; color: var(--primary); border: 1px solid var(--primary); box-shadow: none; }
.btn.sm { padding: 6px 12px; font-size: 12px; }

.row { display: flex; align-items: center; gap: 10px; padding: 12px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--c, var(--border)); border-radius: 10px; text-decoration: none; color: inherit; }
.row.done { opacity: 0.5; }
.row.done .rt { text-decoration: line-through; }
.row.stop { background: transparent; border-style: dashed; }
.row-info { flex: 1; }
.rt { font-weight: 800; font-size: 14px; display: block; }
.rd { font-size: 12px; color: var(--text-mut); font-weight: 700; width: 75px; }

/* Timeline */
.tl { list-style: none; padding: 0; margin: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 48px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(var(--primary), transparent); opacity: 0.3; }
.st { display: grid; grid-template-columns: 38px 12px 1fr; gap: 12px; padding: 10px 0; position: relative; }
.tm { font-size: 11px; font-weight: 800; color: var(--text-mut); text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--primary); margin-top: 5px; z-index: 1; }
.st.k .dot { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
.st.k .tt { opacity: 0.5; text-decoration: line-through; }
.tt { font-weight: 800; font-size: 15px; display: block; }
.sb { font-size: 12px; color: var(--text-mut); margin-top: 2px; display: block; }

/* Form e Input */
.ex { margin-top: 8px; background: var(--bg); border-radius: 8px; padding: 10px; border: 1px solid var(--border); }
.ld { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.ld input { width: 80px; text-align: center; font-weight: 800; color: var(--primary); }
.fl { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--text-mut); align-items: center; }
.fl button { border: 1px solid var(--border); border-radius: 9px; padding: 2px 8px; color: var(--text); }
.fl button.on { background: var(--primary); color: var(--onc); border-color: var(--primary); }

/* Edit Mode */
.edit-controls { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
.edit-controls button { padding: 4px; background: var(--border); border-radius: 6px; color: var(--text); }
.edit-controls button:active { background: var(--primary); color: var(--onc); }
.add-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border: 2px dashed var(--primary); border-radius: 10px; color: var(--primary); font-weight: 800; margin-top: 10px; background: transparent; }
.save-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 20; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
.save-bar .btn { flex: 1; margin: 0; }

/* Timer Dock */
#dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 2px solid var(--primary); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 20px var(--primary-glow); }
.dock-in { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.dock-in::-webkit-scrollbar { display: none; }
#td { font-size: 24px; font-weight: 800; color: var(--primary); min-width: 65px; font-variant-numeric: tabular-nums; }
#tl { flex: 1 1 120px; font-size: 12px; font-weight: 700; line-height: 1.2; }
#dock button { font-size: 11px; font-weight: 800; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; color: var(--text); white-space: nowrap; }

/* Print */
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 12pt; }
  .top, #dock, .nav-icons, .edit-controls, .add-btn, .save-bar, main > .nav { display: none !important; }
  .print-page { page-break-after: always; padding: 20px; border: 2px solid #000; margin-bottom: 20px; }
  .print-page:last-child { page-break-after: auto; }
  .print-header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; align-items: center; }
  .print-logo { width: 60px; height: 60px; object-fit: contain; }
  .print-title { font-size: 18pt; font-weight: bold; }
  .print-sub { font-size: 10pt; color: #555; }
  .print-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: left; }
  .print-table th { background: #eee; }
  .print-notes { margin-top: 20px; border-top: 1px dashed #000; padding-top: 10px; height: 80px; }
  .hero, .row, .card { border-color: #000 !important; box-shadow: none !important; background: transparent !important; }
}
</style>
</head>
<body>

<!-- Watermark Logo di Sfondo -->
<div id="wm-logo"></div>

<header class="top">
  <div class="in brand">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="brand-logo" id="logo-container">BB</div>
      <div>
        <div class="brand-text" id="brand-name">BB Fitness</div>
        <div class="brand-sub" id="brand-sub">La mia palestra</div>
      </div>
    </div>
    <div class="nav-icons">
      <button class="icon-btn" id="btn-weights" title="Esercizi Generali">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M3 8h18M3 16h18M9 4v16M15 4v16"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Impostazioni">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" title="Tema">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>
<div id="dock" class="hid"></div>
<div id="print-container" style="display:none;"></div>

<script>
// --- DATI DI DEFAULT (La tua scheda originale) ---
const DEFAULT_SEQ = "S1 S2 S3 M S4 S1 S2 S3 X X X S4 S1 S2 S3 X X X S4 S1 S2 S3 S5 T M".split(" ");
const DEFAULT_RUN = {"28/11":[6,2],"03/12":[5,3],"10/12":[4,4],"17/12":[3,6]};
const SES = {
  S1: ["Push · spalle, petto, tricipiti", "S1", "var(--s1)"],
  S2: ["Pull · schiena, deltoidi post., bicipiti", "S2", "var(--s2)"],
  S3: ["Corsa a intervalli · Zona 2", "S3", "var(--s3)"],
  S4: ["Spalle + gambe leggere", "S4", "var(--s4)"],
  S5: ["Circuito + cardio", "S5", "var(--s5)"],
  T: ["Test corsa · 20–25 min continui", "TEST", "var(--s3)"],
  M: ["Riposo attivo · mobilità", "MOB", "var(--mb)"],
  X: ["STOP · riposo obbligatorio", "STOP", "var(--st)"]
};

// Funzione per generare la struttura dati della scheda
function getDefaultSchedule() {
  const WD=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  const pad=n=>String(n).padStart(2,"0");
  const DAYS=DEFAULT_SEQ.map((k,i)=>{
    const d=new Date(2026,10,26+i), dd=pad(d.getDate()), mm=pad(d.getMonth()+1);
    return { i, k, key:dd+"/"+mm, id:"d-"+dd+"-"+mm, wd:WD[d.getDay()], customExercises: null };
  });

  // Template base esercizi per tipo
  const getBaseEx = (type) => {
    if(type==="S1") return [
      { name: "Tapis · camminata veloce", sets: "", rest: "", desc: "", time: 5, track: false },
      { name: "Mobilità Pre-Upper", sets: "", rest: "", desc: "Circonduzioni · Wall slide 2x10 · Dislocates", time: 7, track: false },
      { name: "Shoulder press manubri", sets: "3x10-12", rest: "90s", desc: "", time: 9, track: true },
      { name: "Chest press", sets: "3x10-12", rest: "90s", desc: "", time: 9, track: true },
      { name: "Alzate laterali", sets: "3x12-15", rest: "60s", desc: "", time: 7, track: true },
      { name: "Croci ai cavi / pectoral", sets: "3x12-15", rest: "60s", desc: "", time: 7, track: true },
      { name: "Push-down ai cavi", sets: "3x12", rest: "60s", desc: "", time: 6, track: true },
      { name: "Plank", sets: "3x30-40s", rest: "", desc: "", time: 4, track: false },
      { name: "Camminata inclinata (LISS)", sets: "", rest: "", desc: "", time: 20, track: false },
      { name: "Stretching Post-Upper", sets: "", rest: "", desc: "Petto · Dorsali · Deltoide post.", time: 10, track: false }
    ];
    if(type==="S2") return [
      { name: "Tapis · camminata veloce", sets: "", rest: "", desc: "", time: 5, track: false },
      { name: "Mobilità Pre-Upper", sets: "", rest: "", desc: "Cat-camel · Rotazioni toraciche", time: 7, track: false },
      { name: "Lat machine presa larga", sets: "3x10-12", rest: "90s", desc: "", time: 9, track: true },
      { name: "Pulley / rematore ai cavi", sets: "3x10-12", rest: "90s", desc: "", time: 9, track: true },
      { name: "Reverse pec deck", sets: "3x12-15", rest: "60s", desc: "", time: 7, track: true },
      { name: "Face pull ai cavi", sets: "3x15", rest: "60s", desc: "", time: 6, track: true },
      { name: "Curl con manubri", sets: "3x12", rest: "60s", desc: "", time: 6, track: true },
      { name: "Crunch", sets: "3x15", rest: "", desc: "", time: 4, track: false },
      { name: "Camminata inclinata (LISS)", sets: "", rest: "", desc: "", time: 20, track: false },
      { name: "Stretching Post-Upper", sets: "", rest: "", desc: "Dorsali · Deltoide post.", time: 10, track: false }
    ];
    if(type==="S3" || type==="T") {
      // Trova la data corrispondente per capire se è un run o test
      const d = DAYS.find(x => x.k === type);
      let runDesc = "Zona 2 · tapis 1% o esterno", runTime = 20;
      if(type==="S3" && DEFAULT_RUN[d.key]) {
        const [n,r] = DEFAULT_RUN[d.key];
        runDesc = `${n} × (${r} min corsa + 2 min cammino)`;
        runTime = n * (r + 2);
      }
      return [
        { name: "Tapis · camminata veloce", sets: "", rest: "", desc: "", time: 5, track: false },
        { name: "Mobilità Pre-Lower", sets: "", rest: "", desc: "Leg swing · World's Greatest Stretch", time: 7, track: false },
        { name: type==="T" ? "TEST · corsa lenta continua" : "Corsa a intervalli", sets: type==="T" ? "20-25 min" : "", rest: "", desc: runDesc, time: runTime, track: false, isRun: type },
        { name: "Defaticamento · camminata", sets: "", rest: "", desc: "", time: 5, track: false },
        { name: "Stretching Post-Lower", sets: "", rest: "", desc: "Quadricipiti · Femorali · Polpacci", time: 10, track: false }
      ];
    }
    if(type==="S4") return [
      { name: "Tapis · camminata veloce", sets: "", rest: "", desc: "", time: 5, track: false },
      { name: "Mobilità", sets: "", rest: "", desc: "Wall slide 2x10 · Glute bridge 2x12", time: 8, track: false },
      { name: "Alzate laterali ai cavi", sets: "4x12-15", rest: "60s", desc: "", time: 9, track: true },
      { name: "Lento avanti con manubri", sets: "3x10", rest: "90s", desc: "", time: 8, track: true },
      { name: "Panca inclinata con manubri", sets: "3x10", rest: "90s", desc: "", time: 8, track: true },
      { name: "Leg press leggera", sets: "3x12-15", rest: "", desc: "Mai a cedimento", time: 7, track: true },
      { name: "Leg curl da seduto", sets: "2x12-15", rest: "", desc: "", time: 5, track: true },
      { name: "Dead bug / crunch ai cavi", sets: "3x12", rest: "", desc: "", time: 5, track: false },
      { name: "Camminata inclinata (LISS)", sets: "", rest: "", desc: "", time: 20, track: false },
      { name: "Stretching completo", sets: "", rest: "", desc: "30s per lato", time: 10, track: false }
    ];
    if(type==="S5") return [
      { name: "Tapis · camminata veloce", sets: "", rest: "", desc: "", time: 5, track: false },
      { name: "Mobilità Pre-Upper", sets: "", rest: "", desc: "Circonduzioni · 10 squat", time: 7, track: false },
      { name: "Circuito · 2 giri leggeri", sets: "", rest: "", desc: "45s lavoro / 30s pausa", time: 15, track: false },
      { name: "Camminata inclinata (LISS)", sets: "", rest: "", desc: "", time: 25, track: false },
      { name: "Stretching completo", sets: "", rest: "", desc: "30s ciascuno", time: 10, track: false }
    ];
    if(type==="M") return [
      { name: "Mobilità generale", sets: "", rest: "", desc: "Cat-camel · Child pose", time: 12, track: false },
      { name: "Camminata facoltativa", sets: "", rest: "", desc: "8.000-10.000 passi", time: 0, track: false }
    ];
    return [];
  };

  DAYS.forEach(d => { d.exercises = getBaseEx(d.k); });
  return DAYS;
}

// --- STATO GLOBALE E STORAGE ---
let state = {
  schedule: [], // I giorni
  history: {},  // Storico kg
  globalWeights: [], // Esercizi generali
  settings: { theme: "dark", brand: "BB Fitness", gym: "La mia palestra", timers: [30, 60, 90, 120] }
};
let isEditing = false;
let editDraft = null;

function loadState() {
  try {
    const s = localStorage.getItem("gt-state-v2");
    if(s) {
      state = JSON.parse(s);
      // Retrocompatibilità / sicurezza
      if(!state.settings.timers) state.settings.timers = [30, 60, 90, 120];
      if(!state.globalWeights) state.globalWeights = [];
      if(!state.history) state.history = {};
    } else {
      state.schedule = getDefaultSchedule();
      saveState();
    }
  } catch(e) {
    state.schedule = getDefaultSchedule();
  }
}
function saveState() {
  try { localStorage.setItem("gt-state-v2", JSON.stringify(state)); } catch(e) { alert("Errore salvataggio. Usa un server web (https)."); }
}
loadState();

// --- UTILITY ---
const app = document.getElementById("app");
const dock = document.getElementById("dock");
const pad = n => String(n).padStart(2, "0");
const nf = v => String(v).replace(".", ",");
const num = v => parseFloat(String(v || "").replace(",", "."));

// --- RENDER HEADER ---
function renderHeader() {
  document.documentElement.setAttribute("data-theme", state.settings.theme);
  document.getElementById("brand-name").textContent = state.settings.brand;
  document.getElementById("brand-sub").textContent = state.settings.gym;
  
  // Logo: usa immagine se esiste, altrimenti testo BB
  const logoCont = document.getElementById("logo-container");
  if(logoCont.innerHTML === "BB") {
    const img = new Image();
    img.src = "logo.png";
    img.onload = () => { logoCont.innerHTML = `<img src="logo.png" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`; logoCont.style.border = "none"; };
  }
  
  // Watermark
  document.getElementById("wm-logo").innerHTML = `<img src="logo.png" class="wm" onerror="this.outerHTML='<div class=\\'wm\\' style=\\'font-size:30vw;font-weight:900;color:var(--primary);opacity:0.05;text-align:center;line-height:1;\\'>BB</div>'">`;

  // Pulsante Tema
  document.getElementById("btn-theme").onclick = () => {
    state.settings.theme = state.settings.theme === "dark" ? "light" : "dark";
    saveState(); renderHeader(); if(app.innerHTML) route();
  };
}

// --- HOME ---
function renderHome() {
  if(dock) dock.className = "hid";
  const todayIdx = Math.floor((new Date() - new Date(2026, 10, 26)) / 864e5);
  
  let html = `
    <div class="hero" style="margin-bottom: 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="font-size:22px;">Il mio Programma</h2>
        <button class="btn sm" id="btn-print" style="margin:0;"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:4px;"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Stampa</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
        <select id="print-week" style="width:auto; padding:4px 8px; font-size:12px;">
          <option value="1">Settimana 1 (26/11 - 02/12)</option>
          <option value="2">Settimana 2 (03/12 - 09/12)</option>
          <option value="3">Settimana 3 (10/12 - 16/12)</option>
          <option value="4">Settimana 4 (17/12 - 20/12)</option>
        </select>
      </div>

window.toggleDone = (id) => { state.settings[`done-${id}`] = !state.settings[`done-${id}`]; saveState(); renderDay(id); };
window.updateHistory = (dayId, exName, field, val) => {
  const key = `${dayId}-${exName}`;
  if(!state.history[key]) state.history[key] = { kg: "", feel: "", setsDone: null };
  state.history[key][field] = field === 'kg' ? val : (field === 'setsDone' ? val === 'true' : val);
  if(field === 'setsDone' && val === 'true') {
    // Se chiude le serie, salva nel diario generale
    const existing = state.globalWeights.find(w => w.name.toLowerCase() === exName.toLowerCase());
    if(existing) { existing.kg = state.history[key].kg; existing.date = new Date().toLocaleDateString(); }
    else state.globalWeights.push({ name: exName, kg: state.history[key].kg, date: new Date().toLocaleDateString() });
    state.globalWeights.sort((a,b) => a.name.localeCompare(b.name));
  }
  saveState(); renderDay(dayId);
};
window.getDelta = (dayId, exName, currentKg) => {
  if(!currentKg) return "";
  const key = `${dayId}-${exName}`;
  // Trova storico precedente
  const prevs = Object.keys(state.history).filter(k => k.endsWith(`-${exName}`) && k !== key).map(k => ({ k, kg: num(state.history[k].kg), id: k.split('-')[0] }));
  const past = prevs.filter(p => p.id < dayId && p.kg > 0).sort((a,b) => b.id.localeCompare(a.id));
  if(!past.length) return "";
  const diff = num(currentKg) - past[0].kg;
  if(diff === 0) return "=";
  return (diff > 0 ? "+" : "−") + nf(Math.abs(diff)) + " kg";
};

// --- TIMER ---
let T = null, rem = 0, AC = null, Q = null;
document.addEventListener("click", () => { try{ AC = AC || new(window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){} });
const beep = () => { try{ const o=AC.createOscillator(); o.frequency.value=880; o.connect(AC.destination); o.start(); o.stop(AC.currentTime+.35); }catch(e){} navigator.vibrate?.([200,100,300]); };
const fmt = s => pad(Math.floor(s/60))+":"+pad(s%60);

function showDock() { dock.className = ""; }
function hideDock() { dock.className = "hid"; clearInterval(T); }

window.startRunTimer = (type, key) => {
  showDock();
  const phases = [];
  if(type === "T") {
    phases.push(["Corsa", 360], ["Cammino", 60], ["Corsa", 360], ["Cammino", 60], ["Corsa", 360], ["Cammino", 60], ["Corsa finale", 240]);
  } else {
    // Estrai dal default o dalla scheda
    const d = state.schedule.find(x => x.k === "S3" && x.key === key);
    const ex = d?.exercises.find(e => e.isRun);
    const match = ex?.desc.match(/(\d+) × \((\d+) min/);
    if(match) {
      const n = +match[1], r = +match[2];
      for(let i=1; i<=n; i++) phases.push([`Corsa ${i}/${n}`, r*60], ["Cammino", 120]);
    } else { phases.push(["Corsa", 1200]); }
  }
  startPhase(phases);
};

function startPhase(ph) {
  clearInterval(T); let i = 0, end = Date.now() + ph[0][1]*1000;
  const td = document.getElementById("td"), tl = document.getElementById("tl");
  const updateUI = () => {
    tl.textContent = ph[i][0] + (ph[i+1] ? " → " + ph[i+1][0] : "");
    td.textContent = fmt(Math.max(0, Math.ceil((end - Date.now())/1000)));
  };
  updateUI(); beep();
  T = setInterval(() => {
    if(Date.now() >= end) {
      i++;
      if(i >= ph.length) { clearInterval(T); tl.textContent = "Finito"; td.textContent = "00:00"; return; }
      end = Date.now() + ph[i][1]*1000; beep(); updateUI();
    } else { updateUI(); }
  }, 250);
}

      <span id="tl"></span>
      ${timersHtml}
      <button onclick="startSimpleTimer(0)" style="color:var(--st);">Reset</button>
    </div>
  `;
}
window.startSimpleTimer = (sec) => {
  showDock(); clearInterval(T);
  const td = document.getElementById("td"), tl = document.getElementById("tl");
  if(sec === 0) { td.textContent = "00:00"; tl.textContent = ""; hideDock(); return; }
  rem = sec; td.textContent = fmt(rem); tl.textContent = "Timer";
  T = setInterval(() => {
    rem--; td.textContent = fmt(rem);
    if(rem <= 0) { clearInterval(T); beep(); tl.textContent = "Finito!"; }
  }, 1000);
};

// Init
renderHeader();
route();
addEventListener("hashchange", route);
</script>
</body>
